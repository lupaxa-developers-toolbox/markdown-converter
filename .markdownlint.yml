# markdownlint — Lupaxa defaults, short form
default: true

MD003:
  style: atx

MD004:
  style: dash

MD007:
  indent: 2

MD013:
  line_length: 240
  code_block_line_length: 400
  tables: false
  headings: true

MD024:
  siblings_only: true

# Allow trailing punctuation in headings.
MD026:
  punctuation: ""

MD029: false

# One space after simple markers; three for multi-line list items.
MD030:
  ul_single: 1
  ol_single: 1
  ul_multi: 3
  ol_multi: 3

# README HTML (org logo / footer).
MD033: false

MD034: false

MD035:
  style: "---"

# Bold labels inside cards/callouts.
MD036: false

MD040: true

# README starts with HTML, not an ATX heading.
MD041: false

MD046: false

MD048:
  style: backtick

MD049:
  style: asterisk

MD050:
  style: asterisk

# Require pipe-aligned table columns (pad to longest cell per column).
MD060:
  style: aligned
